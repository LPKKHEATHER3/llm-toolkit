<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxy demo</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b6b; --line: #d8d8d8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #ececec; --muted: #9a9a9a; --line: #333; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  #log p { margin: 0 0 12px; white-space: pre-wrap; }
  #log .who { color: var(--muted); font-size: 13px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Proxy demo</h1>
  <p class="who">The API key stays on the server. This page only sends your text.</p>
  <div id="log"></div>
  <form id="f"><input id="q" autocomplete="off" placeholder="Ask about the (fictional) store"><button>Send</button></form>
</main>
<script>
  const history = [];
  const log = document.getElementById("log");
  function add(who, text) {
    const p = document.createElement("p");
    const w = document.createElement("span");
    w.className = "who"; w.textContent = who + ": ";
    p.append(w, document.createTextNode(text));   // text only, never innerHTML
    log.append(p);
  }
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = document.getElementById("q");
    const text = q.value.trim();
    if (!text) return;
    history.push({ role: "user", content: text });
    add("you", text); q.value = "";
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history.slice(-20) }),
    });
    const data = await res.json();
    if (res.ok) { history.push({ role: "assistant", content: data.message }); add("assistant", data.message); }
    else { history.pop(); add("error " + res.status, data.error); }
  });
</script>
</body>
</html>
