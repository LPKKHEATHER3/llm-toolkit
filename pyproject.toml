[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-toolkit"
version = "0.1.0"
description = "Fault-tolerant LLM client, tool-calling agent, BM25 RAG with quote verification, eval harness, MCP server and key-holding proxy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "mcp>=2.3,<3",  # 2.x API (mcp.server.Server, mcp.Client)
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_toolkit = ["proxy/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # line length is left to `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
